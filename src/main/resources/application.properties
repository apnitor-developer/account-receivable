# Set active profile (oracle / sql)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# allow file uploads up to 10MB (change as needed)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Log at INFO for everything
logging.level.root=INFO

#Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS}

# MFA configuration
app.mfa.encryption-key=${APP_MFA_ENCRYPTION_KEY:change-this-mfa-key-change-this}
app.mfa.token-expiration-ms=${APP_MFA_TOKEN_EXPIRATION_MS:300000}
app.mfa.app-name=${APP_MFA_APP_NAME:Account Receivable}
app.mfa.qr-size=${APP_MFA_QR_SIZE:240}
app.mfa.email-otp-expiry-minutes=${APP_MFA_EMAIL_OTP_EXPIRY_MINUTES:5}
app.mfa.rate-limit.max-attempts=${APP_MFA_MAX_ATTEMPTS:5}
app.mfa.rate-limit.window-seconds=${APP_MFA_WINDOW_SECONDS:300}
